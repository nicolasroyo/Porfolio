name: Hoja de contactos
on:
  push:
    paths: ["scripts/contact-sheet.sh", ".github/workflows/contact-sheet.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: bash scripts/contact-sheet.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git pull -q --rebase origin main
          git add hojas
          git diff --cached --quiet || (git commit -m "Hojas de contactos" && git push)
